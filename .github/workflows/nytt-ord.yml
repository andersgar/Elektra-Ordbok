name: Nytt ord fra skjema

# A "Nytt ord" issue becomes a pull request that edits ordbok.yaml.
# The issue body is untrusted input: it is only passed through an env var, never
# interpolated into a shell command.

on:
  issues:
    types: [opened, edited]

concurrency:
  group: nytt-ord-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr:
    if: >-
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'nytt-ord') ||
       startsWith(github.event.issue.title, 'Nytt ord:'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml

      - name: Legg ordet inn i ordbok.yaml
        id: entry
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python tools/issue2entry.py

      - name: Lag pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: nytt-ord/issue-${{ github.event.issue.number }}
          commit-message: "Nytt ord: ${{ steps.entry.outputs.ord }} (#${{ github.event.issue.number }})"
          title: "Nytt ord: ${{ steps.entry.outputs.ord }}"
          body: |
            Foreslått av @${{ github.event.issue.user.login }} i #${{ github.event.issue.number }} (${{ steps.entry.outputs.handling }}).
            Rediger saken for å endre forslaget – denne PR-en oppdateres automatisk.

            Closes #${{ github.event.issue.number }}
          labels: nytt-ord

      # The PDF is built here, in the trusted workflow, so no one has to approve a run.
      # It is uploaded as a Cloudflare preview version with its own URL; production
      # (ordbok.garberg.wtf) is untouched until the pull request is merged.
      - name: Hent PR-grenen
        if: steps.cpr.outputs.pull-request-number != ''
        run: |
          git fetch origin "$GREN"
          git checkout "$GREN"
        env:
          GREN: nytt-ord/issue-${{ github.event.issue.number }}

      - name: Lag LaTeX
        if: steps.cpr.outputs.pull-request-number != ''
        run: python build.py --tex-only

      - name: Kompiler PDF-er
        if: steps.cpr.outputs.pull-request-number != ''
        uses: xu-cheng/latex-action@v3
        with:
          root_file: |
            ordbok.tex
            ordbok-a5.tex
            ordbok-utskrift.tex
          working_directory: build

      - name: Lag nettside
        if: steps.cpr.outputs.pull-request-number != ''
        run: python build.py --site public

      - name: Last opp forhåndsvisning
        id: preview
        if: steps.cpr.outputs.pull-request-number != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.134.0"
          command: >-
            versions upload --preview-alias sak-${{ github.event.issue.number }}
            --message "Nytt ord: ${{ steps.entry.outputs.ord }} (sak ${{ github.event.issue.number }})"

      - name: Finn lenken til forhåndsvisningen
        id: lenke
        if: steps.preview.outcome == 'success'
        env:
          UTDATA: ${{ steps.preview.outputs.command-output }}
        run: |
          url=$(printf '%s' "$UTDATA" | grep -oE 'https://sak-[0-9]+-[A-Za-z0-9.-]+\.workers\.dev' | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Forhåndsvisning: ${url:-fant ingen lenke}"

      - name: Kommenter forhåndsvisningen i PR-en
        if: steps.lenke.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.lenke.outputs.url }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          script: |
            const url = process.env.URL, pr = Number(process.env.PR)
            const marker = '<!-- ordbok-forhandsvisning -->'
            const body = `${marker}\n**Forhåndsvisning av ordboka med dette ordet:**\n\n`
              + `- [Les i nettleseren](${url}/les/)\n`
              + `- [PDF](${url}/ordbok.pdf) · [utskriftsversjon](${url}/ordbok-utskrift.pdf)\n\n`
              + `Oppdateres hvis saken endres. ordbok.garberg.wtf endres først når denne PR-en merges.`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: pr })
            const old = comments.find(c => c.body.includes(marker))
            if (old) await github.rest.issues.updateComment({ ...context.repo, comment_id: old.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: pr, body })

      - name: Svar i saken
        if: steps.cpr.outputs.pull-request-operation == 'created'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `Takk! Forslaget ligger i #${{ steps.cpr.outputs.pull-request-number }} og kommer i ordboka når ordbokansvarlig har godkjent det.`,
            })

      - name: Si fra om feil
        if: failure() && steps.entry.outputs.feil != ''
        uses: actions/github-script@v7
        env:
          FEIL: ${{ steps.entry.outputs.feil }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `Klarte ikke å legge inn ordet:\n\n> ${process.env.FEIL}\n\nRediger saken for å rette det, så prøver jeg igjen.`,
            })
