<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les Elektra-ordboka</title>
<meta name="description" content="Les Elektra-ordboka i nettleseren.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/web/pdf_viewer.css">
<style>
  :root {
    --bar: #ffffff; --bg: #e9ecea; --text: #1d211f; --muted: #5f6763; --line: #d5dad7;
    --green: #009a44; --field: #f3f5f4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bar: #1b1f1d; --bg: #0f1211; --text: #e8ebe9; --muted: #9aa39e; --line: #2c322f; --field: #252a28; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header {
    position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 10;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--bar); border-bottom: 1px solid var(--line);
  }
  header a.home { font-weight: 700; color: var(--text); text-decoration: none; white-space: nowrap; margin-right: auto; }
  header a.home { display: inline-flex; align-items: center; gap: 2px; }
  header a.home img { height: 26px; width: auto; display: block; }
  .search { flex: 0 1 220px; min-width: 0; height: 34px; padding: 0 10px; font: inherit;
    color: var(--text); background: var(--field); border: 1px solid var(--line); border-radius: 8px; }
  .search:focus { outline: 2px solid var(--green); outline-offset: -1px; }
  button, a.btn {
    height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bar); color: var(--text); font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    white-space: nowrap; flex: none;
  }
  button:hover, a.btn:hover { border-color: var(--green); }
  a.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
  .page { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 52px; text-align: center; }
  #viewerContainer { position: absolute; inset: 52px 0 0 0; overflow: auto; }
  #viewer .page { margin: 12px auto; border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
  #status { position: absolute; inset: 52px 0 0 0; display: grid; place-items: center; color: var(--muted); }
  @media (max-width: 640px) {
    header { gap: 6px; padding: 0 8px; }
    header a.home b { display: none; }
    header .hide-sm { display: none; }
    .search { flex-basis: 140px; }
    .page { min-width: 0; flex: none; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../" title="Til forsiden"><img src="../elektra-symbol.png" alt="Elektra"><b>-ordbok</b></a>
  <input class="search" id="search" type="search" placeholder="Søk …" aria-label="Søk i ordboka" enterkeyhint="search">
  <span class="page" id="page" aria-live="polite">–</span>
  <button id="zoomOut" title="Zoom ut" aria-label="Zoom ut">−</button>
  <button id="zoomIn" title="Zoom inn" aria-label="Zoom inn">+</button>
  <a class="btn hide-sm" href="../ordbok.pdf" download="Elektra-ordbok.pdf" title="Last ned PDF">Last ned</a>
  <a class="btn primary" href="https://github.com/andersgar/Elektra-Ordbok/issues/new?template=nytt-ord.yml"
     title="Foreslå et nytt ord">Nytt ord</a>
</header>
<div id="status">Laster ordboka …</div>
<div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div>

<script type="module">
  const CDN = "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289";
  const $ = (id) => document.getElementById(id);
  const status = $("status");

  try {
    const pdfjsLib = await import(`${CDN}/build/pdf.min.mjs`);
    globalThis.pdfjsLib = pdfjsLib; // pdf_viewer.mjs reads it from here
    pdfjsLib.GlobalWorkerOptions.workerSrc = `${CDN}/build/pdf.worker.min.mjs`;
    const { EventBus, PDFLinkService, PDFFindController, PDFViewer, LinkTarget } =
      await import(`${CDN}/web/pdf_viewer.mjs`);

    const eventBus = new EventBus();
    const linkService = new PDFLinkService({ eventBus, externalLinkTarget: LinkTarget.BLANK });
    const findController = new PDFFindController({ eventBus, linkService });
    const viewer = new PDFViewer({ container: $("viewerContainer"), viewer: $("viewer"),
                                   eventBus, linkService, findController });
    linkService.setViewer(viewer);

    let fitWidth = true;
    const fit = () => { if (fitWidth) viewer.currentScaleValue = innerWidth < 900 ? "page-width" : "page-fit"; };
    eventBus.on("pagesinit", () => {
      fit();
      status.remove();
      // /les/#arrkom jumps straight to an entry (ids from ordbok.yaml)
      const dest = decodeURIComponent(location.hash.slice(1));
      if (dest) linkService.goToDestination(dest).catch(() => {});
    });
    eventBus.on("pagechanging", (e) => { $("page").textContent = `${e.pageNumber} / ${viewer.pagesCount}`; });
    addEventListener("resize", fit);

    const zoom = (factor) => {
      fitWidth = false;
      viewer.currentScale = Math.min(4, Math.max(0.3, viewer.currentScale * factor));
    };
    $("zoomIn").onclick = () => zoom(1.2);
    $("zoomOut").onclick = () => zoom(1 / 1.2);

    const find = (type, findPrevious = false) => eventBus.dispatch("find", {
      source: null, type, query: $("search").value, caseSensitive: false, entireWord: false,
      highlightAll: true, findPrevious, matchDiacritics: true,
    });
    $("search").addEventListener("input", () => find(""));
    $("search").addEventListener("keydown", (e) => { if (e.key === "Enter") find("again", e.shiftKey); });

    const doc = await pdfjsLib.getDocument({ url: "../ordbok.pdf" }).promise;
    viewer.setDocument(doc);
    linkService.setDocument(doc, null);
    $("page").textContent = `1 / ${doc.numPages}`;
  } catch (err) {
    console.error(err);
    status.innerHTML = 'Klarte ikke å vise ordboka her. <a href="../ordbok.pdf">Åpne PDF-en direkte</a>.';
  }
</script>
</body>
</html>
