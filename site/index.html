<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elektra-ordboka</title>
<meta name="description" content="Den offisielle ordboka for Linjeforeningen Elektra.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<style>
  :root {
    --bg: #f6f7f5; --card: #ffffff; --text: #1d211f; --muted: #5f6763;
    --green: #009a44; --green-ink: #ffffff; --line: #dfe3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121513; --card: #1b1f1d; --text: #e8ebe9; --muted: #9aa39e; --line: #2c322f; }
    .logo { filter: invert(1) brightness(1.4); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--bg); color: var(--text);
    font: 17px/1.5 "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  }
  main {
    width: 100%; max-width: 480px; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 36px 28px; text-align: center;
  }
  .logo { width: 180px; max-width: 60%; }
  h1 { font-size: 1.7rem; margin: 20px 0 4px; }
  .meta { color: var(--muted); margin: 0 0 28px; font-size: .95rem; }
  a.button {
    display: block; padding: 14px 18px; border-radius: 10px; text-decoration: none;
    font: 600 1rem/1.2 system-ui, sans-serif; margin-top: 10px;
  }
  .primary { background: var(--green); color: var(--green-ink); }
  .primary:hover { filter: brightness(1.08); }
  .secondary { border: 1px solid var(--line); color: var(--text); }
  .secondary:hover { border-color: var(--green); }
  footer { margin-top: 24px; font: .85rem/1.4 system-ui, sans-serif; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="Linjeforeningen Elektra">
  <h1>Elektra-ordboka</h1>
  <p class="meta">{{ANTALL}} ord · sist oppdatert {{DATO}}</p>
  <a class="button primary" href="ordbok.pdf">Les ordboka (PDF)</a>
  <a class="button secondary" href="https://github.com/andersgar/Elektra-Ordbok/issues/new?template=nytt-ord.yml">Foreslå et nytt ord</a>
  <footer>Mangler et ord? Forslag går til ordbokansvarlig før de kommer med.<br>
    <a href="https://github.com/andersgar/Elektra-Ordbok/blob/main/ordbok.yaml">Se kildefila</a></footer>
</main>
</body>
</html>
